
x-wallet-env: &wallet-env
  HTTP_ADDR: ":8080"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://wallet_app:${WALLET_APP_PASSWORD:-wallet_app}@postgres:5432/wallet?sslmode=disable
  DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
  SQS_DLQ_NAME: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_NAME: wallet-events.fifo
  SHUTDOWN_TIMEOUT: 25s
  HTTP_SHUTDOWN_TIMEOUT: 10s
  OIDC_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/wagering
  OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
  OIDC_AUDIENCE: wallet-api

x-wallet: &wallet
  build: .
  image: wallet:local
  # Must exceed SHUTDOWN_TIMEOUT, or Docker sends SIGKILL mid-drain.
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:-wallet_app}
    volumes:
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro,z
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # Checks the application database, which exists only after initdb ran.
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./deploy/localstack/init/ready.d:/etc/localstack/init/ready.d:ro,z
    ports:
      - "127.0.0.1:${LOCALSTACK_HOST_PORT:-4566}:4566"
    healthcheck:
      # Healthy only after the ready.d scripts (queue creation) completed.
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 2s
      timeout: 3s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Fixed issuer: tokens carry iss=http://localhost:8180/realms/wagering
      # whether they are requested from the host or from inside the network.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
    volumes:
      - ./deploy/keycloak/realm-wagering.json:/opt/keycloak/data/import/realm-wagering.json:ro,z
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    healthcheck:
      # The image has no curl; bash's /dev/tcp queries the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  migrate:
    image: migrate/migrate:v4.19.0
    volumes:
      - ./migrations:/migrations:ro,z
    # Runs as the owner role, never as the application role.
    command:
      - -path=/migrations
      - -database=postgres://wallet_owner:${WALLET_OWNER_PASSWORD:-wallet_owner}@postgres:5432/wallet?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Three independent processes (own memory and connections), same image.
  wallet-1:
    <<: *wallet
    environment:
      <<: *wallet-env
      INSTANCE_ID: wallet-1
    ports:
      - "127.0.0.1:8081:8080"

  wallet-2:
    <<: *wallet
    environment:
      <<: *wallet-env
      INSTANCE_ID: wallet-2
    ports:
      - "127.0.0.1:8082:8080"

  wallet-3:
    <<: *wallet
    environment:
      <<: *wallet-env
      INSTANCE_ID: wallet-3
    ports:
      - "127.0.0.1:8083:8080"

volumes:
  postgres-data:
